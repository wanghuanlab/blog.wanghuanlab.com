# WangHuan Lab Blog - Nginx 反向代理配置
# 部署位置示例：/etc/nginx/conf.d/blog.wanghuanlab.com.conf
# 上游为 docker compose 启动的 Node 服务（仅监听 127.0.0.1:3000）

# 按路径决定缓存策略：构建产物带内容哈希可长期缓存，HTML 需及时更新
map $uri $blog_cache_control {
    ~^/_nuxt/                                           "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?)$     "public, max-age=604800";
    ~^/(?:rss|sitemap)\.xml$                            "public, max-age=3600";
    default                                             "public, max-age=0, must-revalidate";
}

upstream wanghuan_lab_blog {
    server 127.0.0.1:3000;
    keepalive 32;
}

# HTTP：保留 ACME 校验路径，其余全部跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name blog.wanghuanlab.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://blog.wanghuanlab.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blog.wanghuanlab.com;

    # ---- HTTPS 证书（按实际路径修改，例如 certbot 生成的证书）----
    ssl_certificate     /etc/letsencrypt/live/blog.wanghuanlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.wanghuanlab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ---- 响应头（location 中不要再写 add_header，否则会覆盖这里的全部配置）----
    add_header Cache-Control $blog_cache_control always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml application/xml application/rss+xml
        application/javascript application/json image/svg+xml;

    client_max_body_size 1m;

    # 统一去掉结尾斜杠，避免重复 URL（根路径除外）
    rewrite ^/(.+)/$ /$1 permanent;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;
    # 缓存策略统一由上方 map 决定
    proxy_hide_header Cache-Control;

    location / {
        proxy_pass http://wanghuan_lab_blog;
    }
}
