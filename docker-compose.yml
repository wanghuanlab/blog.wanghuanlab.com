services:
  blog:
    build:
      context: .
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://blog.wanghuanlab.com}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: wanghuan-lab-blog:latest
    container_name: wanghuan-lab-blog
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://blog.wanghuanlab.com}
    ports:
      # 仅监听本机回环地址，由宿主机 Nginx 反向代理对外提供服务
      - "127.0.0.1:${BLOG_HOST_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
